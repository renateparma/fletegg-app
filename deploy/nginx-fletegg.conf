# deploy/nginx-fletegg.conf
# FleteGG — bloques `location` para agregar DENTRO del `server { ... }` de
# eggclaw.cl en la VM eggclaw-auth (Hetzner). No es un server block completo.
#
# Instalación:
#   sudo cp deploy/nginx-fletegg.conf /etc/nginx/snippets/fletegg.conf
#   # dentro del server { } de eggclaw.cl (443):
#   #   include snippets/fletegg.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Landing estática: copiar la carpeta `landing/` a /var/www/eggclaw/fletegg/
# API Node:         pm2 start backend/ecosystem.config.js  (escucha 127.0.0.1:5912)

# --- API (Express, PM2 "fletegg-api") -------------------------------------
# https://eggclaw.cl/fletegg/api/<ruta>  ->  http://127.0.0.1:5912/api/<ruta>
# La barra final en proxy_pass reemplaza el prefijo /fletegg/api/ por /api/.
location /fletegg/api/ {
    proxy_pass         http://127.0.0.1:5912/api/;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;   # el webhook de Flow llama a la API de Flow
    client_max_body_size  64k;   # payloads chicos (formulario, webhook)

    proxy_redirect off;
}

# --- Landing estática ------------------------------------------------------
# https://eggclaw.cl/fletegg/  ->  /var/www/eggclaw/fletegg/index.html
location = /fletegg {
    return 301 /fletegg/;
}

location /fletegg/ {
    alias /var/www/eggclaw/fletegg/;
    index index.html;
    try_files $uri $uri/ /fletegg/index.html;

    # Cache: assets versionables largo, HTML corto
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        alias /var/www/eggclaw/fletegg/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
